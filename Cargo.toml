[package]
name = "wch-bbs-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for the WCH (wch.cn) community forum"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
htmd = "0.5"
termimad = "0.20"
qrcode = "0.14"
image = "0.24"
dirs = "5"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
html2text = "0.12"

[features]
default = []
# M5 预留：chromiumoxide 扫码兜底 / rquest TLS 指纹模拟
# browser = ["chromiumoxide"]
# fingerprint = ["rquest"]

[profile.release]
strip = true
lto = true
